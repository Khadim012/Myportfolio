# STEP 2 (final) — /etc/nginx/sites-available/khadimhussain.com
# Static Next.js export for https://khadimhussain.com
# Site root: /var/www/khadimhussain.com/current  (symlink to the live release)
# This file only matches khadimhussain.com and www.khadimhussain.com, so other
# sites on the server are unaffected.

# --- HTTP: ACME challenges, everything else -> https://khadimhussain.com ---
server {
    listen 80;
    listen [::]:80;
    server_name khadimhussain.com www.khadimhussain.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://khadimhussain.com$request_uri;
    }
}

# --- HTTPS www -> apex (permanent) ---
server {
    # On nginx >= 1.25.1 you may replace "ssl http2" with "ssl" plus "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.khadimhussain.com;

    ssl_certificate     /etc/letsencrypt/live/khadimhussain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khadimhussain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:khadimhussain_ssl:10m;
    ssl_session_timeout 1d;

    return 301 https://khadimhussain.com$request_uri;
}

# --- HTTPS apex: the site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khadimhussain.com;

    ssl_certificate     /etc/letsencrypt/live/khadimhussain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khadimhussain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:khadimhussain_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/khadimhussain.com/current;
    index index.html;
    charset utf-8;

    # Relative redirects, so /projects/zushh -> /projects/zushh/ keeps https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/manifest+json;

    error_page 404 /404.html;

    # HSTS: start with one year. Do not add includeSubDomains unless every
    # subdomain of khadimhussain.com serves HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    include snippets/khadimhussain.com-headers.conf;

    # Pages: every route is a directory with index.html, so direct visits and
    # refreshes of /projects/<slug>/ resolve on disk. Unknown paths -> 404.html.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include snippets/khadimhussain.com-headers.conf;
    }

    # Content-hashed build assets: cache for a year.
    location ^~ /_next/static/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include snippets/khadimhussain.com-headers.conf;
    }

    # Images, icons and the CV: cache for a day.
    location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include snippets/khadimhussain.com-headers.conf;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include snippets/khadimhussain.com-headers.conf;
    }

    # Never serve dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
