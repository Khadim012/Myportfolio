# STEP 1 (temporary) — /etc/nginx/sites-available/khadimhussain.com
# HTTP-only server used once, so Let's Encrypt can validate the domain.
# Replaced by khadimhussain.com.conf after the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name khadimhussain.com www.khadimhussain.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        root /var/www/khadimhussain.com/current;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
