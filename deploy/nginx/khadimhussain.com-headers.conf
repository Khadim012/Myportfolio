# /etc/nginx/snippets/khadimhussain.com-headers.conf
# Security headers for khadimhussain.com. Included in every location that
# sets its own add_header, because nginx does not inherit add_header into
# a location that declares any add_header of its own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Next.js static export uses small inline scripts, hence 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
